<!DOCTYPE html>
<html lang="zh-TW" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBU3 居家上班規劃 - 2027版 (雲端即時同步)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .sticky-col {
            position: sticky;
            left: 0;
            z-index: 20;
            background-color: #ffffff;
        }
        .sticky-header-col {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 45;
            background-color: #f8fafc;
        }
        .sticky-date-row th {
            position: sticky;
            top: 0;
            z-index: 30;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-full relative">

    <!-- 1. 身分選擇 Modal 彈窗 -->
    <div id="loginModal" class="fixed inset-0 bg-blue-600/95 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all duration-300">
        <div class="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center space-y-6">
            <div class="space-y-2">
                <h2 class="text-2xl font-extrabold text-slate-900 tracking-wide">身分選擇</h2>
                <p class="text-sm text-slate-500">請選擇您的姓名進入雲端系統</p>
            </div>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">選擇進入人員：</label>
                    <select id="modalUserSelect" class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-sm rounded-xl p-3.5 outline-none focus:ring-2 focus:ring-blue-500 font-medium">
                        <option value="" disabled selected>載入人員列表中...</option>
                    </select>
                </div>
                <button id="enterSystemBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-500/30 transition active:scale-[0.98]">
                    進入系統
                </button>
            </div>
        </div>
    </div>

    <!-- 2. 主系統畫面 -->
    <div id="mainAppContainer" class="w-full h-full flex flex-col hidden overflow-hidden">
        
        <!-- 頂部控制區塊 -->
        <div id="topHeader" class="flex-none bg-slate-50 px-3 pt-1 pb-1.5 shadow-sm border-b border-slate-200 space-y-1 z-40">
            <div class="flex items-center justify-between bg-white px-3 py-1 rounded-lg shadow-sm border border-slate-200">
                <div class="flex items-center gap-3">
                    <span class="text-xs sm:text-sm font-semibold text-slate-600">當前身分：<b id="activeUserBadge" class="text-blue-600 font-bold text-sm sm:text-base">未選擇</b></span>
                    <span id="syncStatusHint" class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 雲端連線同步中
                    </span>
                </div>

                <button id="switchUserBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-1 px-2.5 rounded-md border border-slate-300 transition flex items-center gap-1 shadow-sm">
                    🔄 切換身分
                </button>
            </div>

            <!-- Jovin 專屬人員管理區塊 -->
            <div id="adminPanel" class="hidden bg-amber-50 border border-amber-200 rounded-lg p-1.5 space-y-1 shadow-sm">
                <div class="text-xs font-bold text-amber-800 flex items-center gap-1">
                    👑 Jovin大大專屬人員管理選單
                </div>
                <div class="flex flex-wrap gap-2 items-center">
                    <div class="flex gap-1.5 items-center">
                        <input type="text" id="newMemberInput" placeholder="新人員姓名..." class="bg-white border border-slate-200 text-xs rounded-md px-2 py-1 outline-none focus:ring-2 focus:ring-amber-400">
                        <select id="newMemberRoleSelect" class="bg-white border border-slate-200 text-xs rounded-md px-2 py-1 outline-none">
                            <option value="specialist">專員</option>
                            <option value="manager">管理師</option>
                            <option value="unlimited">無限制</option>
                        </select>
                        <button id="addMemberBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-2.5 py-1 rounded-md transition whitespace-nowrap shadow-sm">
                            ➕ 新增成員
                        </button>
                    </div>
                    <div class="h-3 w-px bg-amber-300 hidden sm:block"></div>
                    <div class="flex gap-1.5 items-center">
                        <select id="deleteUserSelect" class="bg-white border border-slate-200 text-xs rounded-md px-2 py-1 outline-none focus:ring-2 focus:ring-rose-400">
                            <!-- 動態填入刪除名單 -->
                        </select>
                        <button id="deleteMemberBtn" class="bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold px-2.5 py-1 rounded-md transition whitespace-nowrap shadow-sm">
                            🗑️ 刪除成員
                        </button>
                    </div>
                </div>
            </div>

            <!-- 標題、月份與規則 -->
            <div class="bg-slate-50 rounded-lg px-2 py-0.5 space-y-1">
                <div class="text-center">
                    <div class="text-xs font-semibold text-blue-600 leading-tight">你好，<span id="userNameText">使用者</span>！</div>
                    <h1 id="monthTitleText" class="text-xl font-black text-slate-900 tracking-tight">2027年1月 居家上班規劃</h1>
                </div>
                
                <div class="flex flex-wrap justify-center items-center gap-3">
                    <div id="monthButtons" class="flex flex-wrap justify-center gap-1 max-w-xl">
                        <!-- 1-12月動態生成 -->
                    </div>
                    
                    <button id="downloadExcelBtn" class="bg-teal-600 hover:bg-teal-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold transition flex items-center gap-1 shadow-sm whitespace-nowrap">
                        📥 下載彩色 Excel
                    </button>

                    <div class="bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 shadow-sm text-left inline-block space-y-0.5 min-w-[130px]">
                        <div class="flex items-center gap-1 text-[11px] font-bold text-slate-900 border-b border-slate-100 pb-0.5">
                            <span>🏠</span>
                            <span>居家辦公規則</span>
                        </div>
                        <div class="text-[10px] text-slate-700 font-medium space-y-0.5">
                            <div>1. 滿<b class="text-blue-600">半年</b>享福利</div>
                            <div>2. 專員每週1天</div>
                            <div>3. 管理師兩週1天</div>
                            <div>4. 單日最多 <b class="text-blue-600">4</b> 人</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 獨立滾動表格區 -->
        <div id="tableWrapper" class="flex-1 overflow-auto p-1">
            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm inline-block min-w-full align-middle">
                <table id="matrixTable" class="w-full text-center border-collapse text-sm table-fixed min-w-[1550px]">
                    <thead id="matrixHead"></thead>
                    <tbody id="matrixBody"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // 避開全域名稱衝突，將變數命名為 supabaseClient
        const SUPABASE_URL = 'https://djjczmcajxjyqjkbjoud.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_kHc06K5jzjqPiAVj-eMGTg_1oOhA_6t';
        
        // 使用 window.supabase 建立 Client 並賦值給 supabaseClient
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        const HOLIDAYS_2027 = {
            '2027-01-01': '中華民國開國紀念日', '2027-01-02': '元旦連假', '2027-01-03': '元旦連假',
            '2027-02-06': '農曆春節彈性放假', '2027-02-07': '春節週末', '2027-02-08': '農曆除夕',
            '2027-02-09': '春節(初一)', '2027-02-10': '春節(初二)', '2027-02-11': '春節(初三)',
            '2027-02-12': '春節補假', '2027-02-13': '春節週末', '2027-02-14': '春節週末',
            '2027-02-27': '228和平紀念日連假', '2027-02-28': '228和平紀念日', '2027-03-01': '228和平紀念日補假',
            '2027-04-03': '清明連假', '2027-04-04': '兒童節', '2027-04-05': '民族掃墓節(清明節)',
            '2027-04-06': '兒童節補假', '2027-04-30': '調整放假日', '2027-06-09': '指定放假日',
            '2027-06-19': '端午連假', '2027-06-20': '端午節', '2027-09-15': '指定放假日',
            '2027-09-24': '中秋節', '2027-09-25': '中秋連假', '2027-09-26': '中秋連假',
            '2027-09-28': '教師節', '2027-10-09': '國慶連假', '2027-10-10': '國慶日',
            '2027-10-11': '國慶日補假', '2027-10-25': '臺灣光復節', '2027-12-24': '平安夜放假'
        };

        const ADMIN_NAME = 'Jovin大大專屬';
        const WEEKDAYS = ['日', '一', '二', '三', '四', '五', '六'];

        let memberRoles = {};
        let members = [];
        let wfhData = {}; // 格式: { '2027-01-04': ['Sally', 'Hanwei'] }
        
        let currentYear = 2027;
        let currentMonth = 0;
        let currentUser = null;

        // 頁面 DOM 元素
        const loginModal = document.getElementById('loginModal');
        const mainAppContainer = document.getElementById('mainAppContainer');
        const modalUserSelect = document.getElementById('modalUserSelect');
        const deleteUserSelect = document.getElementById('deleteUserSelect');
        const enterSystemBtn = document.getElementById('enterSystemBtn');
        const switchUserBtn = document.getElementById('switchUserBtn');
        const addMemberBtn = document.getElementById('addMemberBtn');
        const deleteMemberBtn = document.getElementById('deleteMemberBtn');
        const downloadExcelBtn = document.getElementById('downloadExcelBtn');
        const newMemberInput = document.getElementById('newMemberInput');
        const newMemberRoleSelect = document.getElementById('newMemberRoleSelect');
        const userNameText = document.getElementById('userNameText');
        const activeUserBadge = document.getElementById('activeUserBadge');
        const adminPanel = document.getElementById('adminPanel');

        // --- 雲端資料同步機制 ---
        async function fetchCloudData() {
            const { data: memberRows, error: mErr } = await supabaseClient.from('members').select('*');
            if (!mErr && memberRows) {
                memberRoles = {};
                memberRows.forEach(row => { memberRoles[row.name] = row.role; });
                const keys = Object.keys(memberRoles).filter(m => m !== ADMIN_NAME);
                members = [...keys, ADMIN_NAME];
                updateMemberDropdowns();
            }

            const { data: recordRows, error: rErr } = await supabaseClient.from('wfh_records').select('*');
            if (!rErr && recordRows) {
                wfhData = {};
                recordRows.forEach(row => {
                    if (!wfhData[row.date_str]) wfhData[row.date_str] = [];
                    wfhData[row.date_str].push(row.user_name);
                });
            }

            renderMatrix();
        }

        function subscribeRealtime() {
            supabaseClient
                .channel('realtime_wfh_changes')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'wfh_records' }, () => {
                    fetchCloudData();
                })
                .on('postgres_changes', { event: '*', schema: 'public', table: 'members' }, () => {
                    fetchCloudData();
                })
                .subscribe();
        }

        function formatDisplayName(name) {
            return `<span class="text-blue-600 font-bold text-xs sm:text-sm whitespace-nowrap">${name}</span>`;
        }

        function updateMemberDropdowns() {
            const currentSelectedModal = modalUserSelect.value;
            modalUserSelect.innerHTML = '<option value="" disabled>請選擇您的姓名...</option>';
            deleteUserSelect.innerHTML = '<option value="" disabled selected>選擇要刪除的人員...</option>';

            members.forEach(name => {
                const opt1 = document.createElement('option');
                opt1.value = name;
                opt1.innerText = name;
                if (name === currentSelectedModal) opt1.selected = true;
                modalUserSelect.appendChild(opt1);

                if (name !== ADMIN_NAME) {
                    const opt2 = document.createElement('option');
                    opt2.value = name;
                    opt2.innerText = name;
                    deleteUserSelect.appendChild(opt2);
                }
            });

            if (!currentSelectedModal) modalUserSelect.selectedIndex = 0;
        }

        // 事件處置
        switchUserBtn.addEventListener('click', () => {
            loginModal.classList.remove('opacity-0', 'pointer-events-none');
            mainAppContainer.classList.add('hidden');
        });

        addMemberBtn.addEventListener('click', async () => {
            const name = newMemberInput.value.trim();
            const role = newMemberRoleSelect.value;
            if (!name) return alert('⚠️ 請輸入人員姓名！');
            if (memberRoles[name]) return alert('⚠ 該人員已存在！');

            const { error } = await supabaseClient.from('members').insert([{ name, role }]);
            if (error) {
                alert('❌ 新增失敗：' + error.message);
            } else {
                newMemberInput.value = '';
                await fetchCloudData();
                alert(`ℹ️ 已成功新增人員：${name}`);
            }
        });

        deleteMemberBtn.addEventListener('click', async () => {
            const selected = deleteUserSelect.value;
            if (!selected) return alert('⚠️️ 請先選擇要刪除的人員！');
            if (selected === ADMIN_NAME) return alert('⚠️️ 此為管理者專屬入口，無法刪除！');
            
            if (confirm(`❓ 確定要刪除「${selected}」嗎？`)) {
                const { error } = await supabaseClient.from('members').delete().eq('name', selected);
                if (error) {
                    alert('❌ 刪除失敗：' + error.message);
                } else {
                    await supabaseClient.from('wfh_records').delete().eq('user_name', selected);
                    if (currentUser === selected) {
                        currentUser = null;
                        userNameText.innerText = '使用者';
                        activeUserBadge.innerText = '未選擇';
                        adminPanel.classList.add('hidden');
                    }
                    await fetchCloudData();
                    alert(`ℹ️ 已刪除人員：${selected}`);
                }
            }
        });

        enterSystemBtn.addEventListener('click', () => {
            const selected = modalUserSelect.value;
            if (!selected) return alert('⚠️ 請先選擇您的姓名！');
            currentUser = selected;
            userNameText.innerText = currentUser;
            activeUserBadge.innerText = currentUser;
            
            if (currentUser === ADMIN_NAME) {
                adminPanel.classList.remove('hidden');
            } else {
                adminPanel.classList.add('hidden');
            }

            loginModal.classList.add('opacity-0', 'pointer-events-none');
            mainAppContainer.classList.remove('hidden');
            renderMatrix();
        });

        function getISOWeek(dateObj) {
            const d = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return { year: d.getUTCFullYear(), week: weekNo };
        }

        function validateRoleQuota(dateStr, user) {
            const role = memberRoles[user];
            if (role === 'unlimited') return true;

            const targetDate = new Date(dateStr);
            const targetWeekInfo = getISOWeek(targetDate);
            const targetWeekKey = targetWeekInfo.year * 100 + targetWeekInfo.week;

            if (role === 'specialist') {
                for (let dStr in wfhData) {
                    if (wfhData[dStr].includes(user) && dStr !== dateStr) {
                        const d = new Date(dStr);
                        const wInfo = getISOWeek(d);
                        const wKey = wInfo.year * 100 + wInfo.week;
                        if (wKey === targetWeekKey) {
                            alert(`🚫 限制提醒：專員同一曆週（第 ${targetWeekInfo.week} 週）最多只能選擇 1 天居家辦公！`);
                            return false;
                        }
                    }
                }
            } else if (role === 'manager') {
                for (let dStr in wfhData) {
                    if (wfhData[dStr].includes(user) && dStr !== dateStr) {
                        const d = new Date(dStr);
                        const wInfo = getISOWeek(d);
                        const weekDiff = Math.abs((targetWeekInfo.year - wInfo.year) * 52 + (targetWeekInfo.week - wInfo.week));
                        if (weekDiff < 2) {
                            alert(`🚫 限制提醒：管理師填寫 1 週後必須隔週才能再填寫！`);
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function renderMonthButtons() {
            const container = document.getElementById('monthButtons');
            container.innerHTML = '';
            for (let m = 0; m < 12; m++) {
                const isSelected = m === currentMonth;
                const btn = document.createElement('button');
                btn.className = `px-2.5 py-1 rounded-md text-xs font-bold transition shadow-sm ${isSelected ? 'bg-blue-600 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-100'}`;
                btn.innerText = `${m + 1}月`;
                btn.onclick = () => {
                    currentMonth = m;
                    renderMonthButtons();
                    renderMatrix();
                };
                container.appendChild(btn);
            }
        }

        function renderMatrix() {
            document.getElementById('monthTitleText').innerText = `${currentYear}年${currentMonth + 1}月 居家上班規劃`;
            const head = document.getElementById('matrixHead');
            const body = document.getElementById('matrixBody');
            head.innerHTML = '';
            body.innerHTML = '';

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const nameColWidth = '145px'; 
            const dayColWidth = `${(100 - 8) / daysInMonth}%`;

            let trHead = `<tr class="sticky-date-row border-b border-slate-200" style="height: 50px;"><th class="p-1 header-bg border-r border-slate-200 text-blue-700 font-bold text-center text-xs sm:text-sm sticky-header-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]" style="width: ${nameColWidth};">姓名</th>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const dateObj = new Date(currentYear, currentMonth, d);
                const dayOfWeek = dateObj.getDay();
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                const holidayName = HOLIDAYS_2027[dateStr];
                const isHoliday = !!holidayName || dayOfWeek === 0 || dayOfWeek === 6;

                const textClass = isHoliday ? 'text-rose-500 font-bold holiday-bg' : 'text-slate-700';
                const bgStyle = isHoliday ? 'background-color: #ffe4e6; color: #e11d48;' : 'background-color: #f8fafc;';

                trHead += `<th class="p-1 border-r border-slate-200 ${textClass}" style="${bgStyle} width: ${dayColWidth}; min-width: 44px;">
                    <div class="text-xs sm:text-sm font-black tracking-tight leading-snug">${currentMonth + 1}/${d}</div>
                    <div class="text-[10px] sm:text-xs font-bold leading-tight">(${WEEKDAYS[dayOfWeek]})</div>
                </th>`;
            }
            trHead += `</tr>`;
            head.innerHTML = trHead;

            members.forEach(member => {
                const displayName = formatDisplayName(member);
                let trRow = `<tr class="border-b border-slate-200 hover:bg-slate-50/50" style="height: 48px;"><td class="p-1 border-r border-slate-200 bg-white text-center sticky-col shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)] overflow-hidden text-ellipsis" style="width: ${nameColWidth};">${displayName}</td>`;

                for (let d = 1; d <= daysInMonth; d++) {
                    const dateObj = new Date(currentYear, currentMonth, d);
                    const dayOfWeek = dateObj.getDay();
                    const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    
                    const holidayName = HOLIDAYS_2027[dateStr];
                    const isHoliday = !!holidayName || dayOfWeek === 0 || dayOfWeek === 6;

                    const isEditable = currentUser && (member === currentUser) && !isHoliday;
                    const cursorClass = isEditable ? 'cursor-pointer hover:bg-amber-100/50' : 'cursor-not-allowed';

                    const bookedList = wfhData[dateStr] || [];
                    const isBooked = bookedList.includes(member);

                    let cellBgClass = '';
                    let styleAttr = `width: ${dayColWidth}; min-width: 44px;`;
                    let indicator = '';

                    if (isHoliday) {
                        cellBgClass = 'holiday-bg';
                        styleAttr += 'background-color: #ffe4e6;';
                    }

                    if (isBooked) {
                        cellBgClass = 'wfh-bg';
                        styleAttr += 'background-color: #fef08a; color: #2563eb; font-weight: bold;';
                        indicator = `<span class="wfh-symbol text-blue-600 font-extrabold text-xl leading-none" style="color:#2563eb;">○</span>`;
                    }

                    trRow += `<td class="p-0 border-r border-slate-200 text-center ${cellBgClass} ${cursorClass}" style="${styleAttr}" onclick="toggleWFH('${dateStr}', '${member}', ${isHoliday}, '${holidayName || ''}')">
                        ${indicator}
                    </td>`;
                }
                trRow += `</tr>`;
                body.innerHTML += trRow;
            });
        }

        async function toggleWFH(dateStr, member, isHoliday, holidayName) {
            if (isHoliday) {
                const reason = holidayName ? `國定假日/補假（${holidayName}）` : '週末假期';
                alert(`🚫 提醒：${reason}無法設定居家辦公！`);
                return;
            }
            if (!currentUser) {
                alert('⚠️ 提醒：請先選擇您的身分以開始排程！');
                loginModal.classList.remove('opacity-0', 'pointer-events-none');
                return;
            }
            if (member !== currentUser) {
                alert(`🔒 權限提醒：您當前登入為「${currentUser}」，無法修改其他人的預約！`);
                return;
            }

            const currentBookedList = wfhData[dateStr] || [];
            const isBooked = currentBookedList.includes(member);

            if (isBooked) {
                // 刪除紀錄
                const { error } = await supabaseClient.from('wfh_records')
                    .delete()
                    .eq('date_str', dateStr)
                    .eq('user_name', member);
                
                if (error) alert('❌ 雲端更新失敗：' + error.message);
            } else {
                // 新增預約 (檢查規則)
                const userRole = memberRoles[member];
                if (userRole !== 'unlimited') {
                    if (currentBookedList.length >= 4) {
                        alert('⚠ 額滿提醒：單日最多限 4 人居家辦公！');
                        return;
                    }
                }
                if (!validateRoleQuota(dateStr, member)) return;

                const { error } = await supabaseClient.from('wfh_records')
                    .insert([{ date_str: dateStr, user_name: member }]);
                
                if (error) alert('❌ 雲端預約失敗：' + error.message);
            }
            
            // 重新整理資料
            fetchCloudData();
        }

        // 下載 Excel
        downloadExcelBtn.addEventListener('click', () => {
            const table = document.getElementById('matrixTable');
            const cloneTable = table.cloneNode(true);
            const fileName = `SBU3_居家辦公規劃_${currentYear}年${currentMonth + 1}月.xls`;
            
            const excelTemplate = `
                <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
                <head>
                    <meta charset="utf-8" />
                    <style>
                        table { border-collapse: collapse; font-family: "Calibri", "Microsoft JhengHei", sans-serif; font-size: 11pt; }
                        tr { height: 52px; }
                        th, td { border: 1px solid #cbd5e1; text-align: center; padding: 10px 6px; vertical-align: middle; white-space: nowrap; font-size: 11pt; mso-number-format:"\@"; }
                        .holiday-bg { background-color: #ffe4e6 !important; color: #e11d48 !important; font-weight: bold; }
                        .wfh-bg { background-color: #fef08a !important; color: #2563eb !important; font-weight: bold; }
                        .wfh-symbol { font-size: 20px !important; font-weight: bold !important; color: #2563eb !important; }
                        .header-bg { background-color: #f8fafc; font-weight: bold; }
                    </style>
                </head>
                <body>${cloneTable.outerHTML}</body>
                </html>
            `;

            const blob = new Blob([excelTemplate], { type: 'application/vnd.ms-excel;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // 初始化頁面與資料
        renderMonthButtons();
        fetchCloudData();
        subscribeRealtime();
    </script>
</body>
</html>
